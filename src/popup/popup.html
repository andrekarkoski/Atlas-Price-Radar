<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atlas Price Radar</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <h1>Atlas Price Radar</h1>

  <label for="product-name">Produto</label>
  <input
    id="product-name"
    type="text"
    placeholder="Ex.: Acer Aspire Go 15"
  >

  <label for="target-price">Preço-alvo</label>
  <input
    id="target-price"
    type="number"
    step="0.01"
    placeholder="Ex.: 5000"
  >

  <button id="add-product">Adicionar produto</button>

  <p id="status"></p>
  <h2>Produtos monitorados</h2>

  <ul id="product-list"></ul>

  <h2>Ofertas encontradas</h2>

  <ul id="offer-list"></ul>

  <script type="module" src="../../dist/popup/popup.js"></script>
</body>
</html>
